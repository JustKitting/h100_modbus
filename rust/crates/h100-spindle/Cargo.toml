[package]
name = "h100-spindle"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[lib]
name = "h100_spindle"
crate-type = ["cdylib", "rlib"]

[features]
default = ["realtime-component"]
realtime-component = ["dep:dmc2-hal-sys"]

[dependencies]
dmc2-diagnostics = { path = "../../../../linuxcnc_dmc2/rust/crates/dmc2-diagnostics" }
dmc2-hal-sys = { path = "../../../../linuxcnc_dmc2/rust/crates/dmc2-hal-sys", optional = true }
